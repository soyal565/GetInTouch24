<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Password - GetInTouch24</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Same font as my site -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="css/reset-password.css" rel="stylesheet">
    <script src="js/config.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/common.js"></script>

</head>

<body>

    <!-- ===== NAVBAR ===== -->
    <div class="navbar">
        <h2>GetInTouch24</h2>
        <div>
            <a href="index.html" style="color:white; text-decoration:none;">Home</a>
        </div>
    </div>

    <!-- ===== RESET SECTION ===== -->
    <section class="auth-section">
        <div class="auth-box">
            <h3>Reset Your Password</h3>

            <form id="resetForm">

                <div class="input-group">
                    <i class="fa-solid fa-key"></i>
                    <input type="text" id="otp" placeholder="Enter OTP" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="New Password" required>
                    <i class="fa-solid fa-eye toggle-password-icon" data-target="newPassword"></i>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <i class="fa-solid fa-eye toggle-password-icon" data-target="confirmPassword"></i>
                </div>

                <div class="error-msg" id="errorMsg"></div>

                <button type="submit" class="btn-primary">
                    Update Password
                </button>
            </form>

            <div class="success-msg" id="successMsg"></div>
        </div>
    </section>
</body>
<script src="js/reset-password.js"></script>

</html>
